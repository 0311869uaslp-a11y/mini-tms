# ========== H2 DATABASE (TEMPORAL) ==========
# Base de datos en memoria - No necesita instalación
spring.datasource.url=jdbc:h2:mem:minitmsdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console - Para ver la BD en navegador
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Config
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop  # O update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Mostrar SQL en consola (muy útil para debugging)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.minitms=DEBUG

# Server Config
server.port=8080
# server.servlet.context-path=/api  # Comenta esta línea si quieres sin /api

# Desactivar validación de esquema (opcional)
spring.jpa.properties.hibernate.hbm2ddl.auto=create-drop